<script>
  (function () {
    function readStoredTheme() {
      try {
        return localStorage.getItem('ds-storybook-theme') === 'dark' ? 'dark' : 'light';
      } catch (_error) {
        return 'light';
      }
    }

    const theme = readStoredTheme();
    const viewMode = new URLSearchParams(location.search).get('viewMode') === 'docs' ? 'docs' : 'story';
    document.documentElement.setAttribute('data-ds-theme', theme);
    document.documentElement.setAttribute('data-ds-view-mode', viewMode);
    if (viewMode === 'docs') {
      document.documentElement.setAttribute('data-ds-docs-ready', 'false');
    }

    function labelLoader(selector, label) {
      const loader = document.querySelector(selector);
      if (!loader) {
        return false;
      }
      loader.setAttribute('role', 'status');
      loader.setAttribute('aria-live', 'polite');
      loader.setAttribute('aria-label', label);
      return true;
    }

    function labelLoadingStates() {
      labelLoader('.sb-preparing-story', 'Loading story...');
      labelLoader('.sb-preparing-docs', 'Loading documentation...');
    }

    document.addEventListener('DOMContentLoaded', labelLoadingStates, { once: true });
  })();
</script>

  html[data-ds-theme='light'] {
    --ds-preview-loading-bg: #faf8f5;
    --ds-preview-loading-fg: #0b0b0c;
    --ds-preview-loading-muted: #6b6b6e;

  }

    --ds-preview-loading-accent: #6a95e8;
  }

  html[data-ds-view-mode='docs'] {

  }

  html,
  body,
  .sb-preparing-story,
  .sb-preparing-docs {
    background: var(--ds-color-bg, var(--ds-preview-loading-bg)) !important;
    color: var(--ds-color-fg, var(--ds-preview-loading-fg)) !important;
  }

  .sb-preparing-story .sb-loader,
  .sb-preparing-docs .sb-loader {
    box-sizing: border-box;
    width: 2.5rem;
    height: 2.5rem;
    border-style: solid !important;
    border-width: 3px !important;
    border-color: color-mix(in srgb, var(--ds-color-fg-muted, var(--ds-preview-loading-muted)) 35%, transparent);
    border-top-color: var(--ds-color-accent, var(--ds-preview-loading-accent));
    border-radius: 50%;
    animation: ds-loading-spin 0.7s linear infinite !important;
    mix-blend-mode: normal;
  }

  .sb-preparing-story .sb-loader {
    margin: -1.25rem 0 0 -1.25rem;
  }

  .sb-preparing-docs .sb-loader {
    position: static !important;
    inset: auto !important;
    margin: 0 !important;
  }

  @keyframes ds-loading-spin {
    to {
      transform: rotate(360deg);
    }
  }

  .sb-preparing-docs {
    align-items: center;
    flex-direction: column;
    gap: 1rem;
    justify-content: center;
  }

  body.sb-show-preparing-docs > .sb-preparing-docs {
    display: flex !important;
  }

  .sb-preparing-docs .sb-previewBlock {
    width: 2.5rem;
    height: 2.5rem;
    margin: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .sb-preparing-docs .sb-previewBlock_header,
  .sb-preparing-docs .sb-argstableBlock {
    display: none;
  }

  .sb-preparing-docs .sb-previewBlock_body {
    height: 2.5rem;
    border: 0;
    background: transparent;
  }

  .sb-preparing-docs::after {
    content: 'Loading documentation...';
    color: var(--ds-color-fg-muted, var(--ds-preview-loading-muted));
    font:
      500 1rem/1.5 system-ui,
      sans-serif;
  }

  html[data-ds-docs-ready='false'] body.sb-show-main > #storybook-docs {
    visibility: hidden;
  }

  html[data-ds-docs-ready='false'] body.sb-show-main > .sb-preparing-docs {

</style>

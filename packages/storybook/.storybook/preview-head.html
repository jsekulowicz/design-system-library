<script>
  (function () {
    var theme = 'light';
    try {
      theme = localStorage.getItem('ds-storybook-theme') === 'dark' ? 'dark' : 'light';
    } catch (_error) {
      theme = 'light';
    }
    document.documentElement.setAttribute('data-ds-theme', theme);
    if (new URLSearchParams(location.search).get('viewMode') === 'docs') {
      document.documentElement.setAttribute('data-ds-docs-ready', 'false');
    }
  })();
</script>
<style>
  html[data-ds-theme='light'] {
